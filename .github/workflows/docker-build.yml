name: Docker Build and Push

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - 'conda-env.yml'
      - '.github/workflows/docker-build.yml'

env:
  DOCKER_IMAGE: etal/cnvkit
  # Alternative: ghcr.io/${{ github.repository_owner }}/cnvkit

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # For GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history and all tags, which the version step ranks

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Uncomment to enable GitHub Container Registry as backup
      # - name: Log in to GitHub Container Registry
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          # Highest stable release tag (three or more numeric components)
          # matching a glob.
          highest() {
            git tag --list "$1" --sort=-v:refname | grep -Em1 '^v[0-9]+\.[0-9]+(\.[0-9]+)+$'
          }
          VERSION=devel
          IS_RELEASE=false
          SERIES=
          IS_HIGHEST=false
          IS_HIGHEST_IN_SERIES=false
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            IS_RELEASE=true
            # The floating tags never move backward: 'latest' moves only for
            # the highest stable tag overall, and 'X.Y' only for the highest in
            # that minor series. A prerelease, or a tag that is not the highest
            # in its series (e.g. v0.9.13.1 after v0.9.14), publishes only its
            # exact version.
            if [[ $VERSION =~ ^([0-9]+\.[0-9]+)(\.[0-9]+)+$ ]]; then
              SERIES=${BASH_REMATCH[1]}
              if [[ v$VERSION == "$(highest 'v*')" ]]; then
                IS_HIGHEST=true
              fi
              if [[ v$VERSION == "$(highest "v$SERIES.*")" ]]; then
                IS_HIGHEST_IN_SERIES=true
              fi
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "series=${SERIES}" >> "$GITHUB_OUTPUT"
          echo "is_highest=${IS_HIGHEST}" >> "$GITHUB_OUTPUT"
          echo "is_highest_in_series=${IS_HIGHEST_IN_SERIES}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          # This workflow decides which tags a ref owns, so the action must not
          # infer 'latest' from the version string.
          flavor: latest=false
          tags: |
            # Exact version on every release tag, verbatim (v0.9.13.1 -> 0.9.13.1)
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release == 'true' }}
            # Minor series (v0.9.14 -> 0.9) for the highest stable release in it
            type=raw,value=${{ steps.version.outputs.series }},enable=${{ steps.version.outputs.is_highest_in_series == 'true' }}
            # 'latest' for the highest stable release overall
            type=raw,value=latest,enable=${{ steps.version.outputs.is_highest == 'true' }}
            # Tag as 'devel' on master branch commits
            type=raw,value=devel,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=CNVkit
            org.opencontainers.image.description=Copy number variant detection from high-throughput sequencing
            org.opencontainers.image.vendor=Eric Talevich

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CNVKIT_VERSION=${{ steps.version.outputs.is_release == 'true' && steps.version.outputs.version || '' }}

      - name: Docker image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Image pushed with tags:"
          echo "${{ steps.meta.outputs.tags }}"
